name: Deploy Redis to GHCR

env:
  DOTNET_VERSION: '6.0.x'

on:
  push:
    branches:
      - main
    paths:
      - apps/redis/**
  workflow_dispatch:

permissions: {}

jobs:
      push-app-image:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        permissions:
          contents: read
          packages: write
        defaults:
          run:
            working-directory: './apps/redis'
        steps:
          - name: 'Checkout GitHub Action'
            uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main

          - name: 'Login to GitHub Container Registry'
            uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
            with:
              registry: ghcr.io
              username: ${{github.actor}}
              password: ${{secrets.GITHUB_TOKEN}}

          - name: 'Build Inventory Image'
            run: |
              docker build . --tag ghcr.io/firecrawl/firecrawl-redis:latest
              docker push ghcr.io/firecrawl/firecrawl-redis:latest